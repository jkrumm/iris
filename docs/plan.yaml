  # --- Owner usage feedback, 2026-11-16 (iPhone and Mac). Server rows run beside the Apple rows; Apple rows share lane `apple` (one at a time).
  - key: memo-titles-gist
    title: Transcribe memos get a summarized title, and long transcripts a short gist of what was said
    facts:
      why: >-
        Owner feedback 2026-11-16. A transcribe-only memo has no title: TRANSCRIBE_ONLY_STEPS in
        server/src/memo/memo.ts:320 is ingest, transcribe, notify, so `summarize` never runs and the clients fall back to
        the first 60 characters of sloppy dictation (apple/Iris/MemoPresentation.swift:8-27). In a Hermes conversation
        the owner's own turn is shown whole (transcripts average 615 characters in production, the longest 5091); he
        wants a short summary of what he said with the full text one tap away.
      what: >-
        server/src/memo/memo.ts (step lists, Summary), server/src/pipeline/steps.ts (handlers.summarize),
        server/src/ports/summarizer.ts, server/src/adapters/agw.ts, the memo wire schema in server/src/http/schemas.ts,
        contracts/ (make contracts, fixtures, make check-contracts), docs/http-api.md, docs/server-design.md. No Apple
        code: the clients follow in row turn-collapse.
      change: >-
        (1) Run `summarize` for transcribe memos too (optional step, as today): agw POST /triage already accepts
        `reply: null`, so the headline, detail and spoken line come from the transcript alone; `notify` then uses that
        headline. (2) A nullable `transcriptGist` on the memo (at most 240 characters, the transcript's language): what
        the speaker said or asked, written only when the transcript is longer than 400 characters. Produce it inside the
        `summarize` step with one more cheap call through the agw host (the `llm summarize` capability; read `agw schema
        llm summarize` for its route and options) behind the Summarizer port, and treat its failure like a failed
        optional step: the memo still reaches notified. For a transcribe memo the triage `detail` may serve as the gist
        if it reads as one, which saves the second call. (3) A one-off, idempotent script under scripts/ (or the existing
        retry route from `summarize`) that titles the existing transcribe memos; run it once after the deploy.
      acceptance: >-
        A fake-booted test sends a transcribe memo and reads back summary.headline that is not the transcript's first
        words; a Hermes memo with a 900-character transcript has transcriptGist, one with 200 characters has null; a
        failing gist call leaves the memo notified; make check-contracts and make e2e pass; after the deploy `make
        smoke` still reaches notified and a real transcribe memo (id named in the ship note) shows a headline; the
        backfill ran and its count is in the ship note.

  - key: search-typos
    title: Memo search tolerates a typo and also finds what Hermes answered
    facts:
      why: >-
        Owner feedback 2026-11-16: typing a misspelt "espresso" in the Mac search finds nothing. Search is FTS5 with
        every word quoted, prefix-matched and ANDed (ftsMatch in server/src/adapters/sqlite.ts:252-260), so one wrong
        letter gives zero rows; the index (memo_fts, server/src/adapters/sqlite-migrations.ts:120-146) covers only the
        transcript and the summary headline, not the reply text, hermes_headline or the thread title.
      what: >-
        server/src/adapters/sqlite.ts, server/src/adapters/sqlite-migrations.ts (a new migration, never an edited one),
        their tests, docs/http-api.md and docs/server-design.md. The route, its `q` parameter and the response shape
        stay as they are: no contract change, no client change.
      change: >-
        (1) Index reply_text, hermes_headline and the thread title as well, with a migration that rebuilds the index.
        (2) Typo tolerance without a native extension (bun:sqlite loads none): when the exact prefix query returns
        nothing, correct each query word of four or more letters against the index vocabulary (an fts5vocab table) by
        Damerau-Levenshtein distance (1 for words up to 7 letters, 2 above), take the few nearest terms and run the
        query again with them ORed per word. Check that the tokenizer folds case and diacritics (unicode61
        remove_diacritics 2) so "uber" finds "über". Exact hits always rank before corrected ones. This is a
        single-owner database of a few hundred memos: keep it in SQL plus a small pure function, no search service.
      acceptance: >-
        Tests in the sqlite adapter suite: "expresso" and "esspreso" find a memo whose transcript says "Espresso"; a
        word that occurs only in a reply finds its memo; an exact match is listed before a corrected one; a query with
        no near term still returns an empty list; the migration runs on a copy of a database with existing memos. make
        check-fast and make e2e pass; after the deploy `GET /v1/memos?q=expresso` on production returns a memo (quote
        the count).

  - key: speech-variants
    title: The spoken reply can be asked for as a summary or in full
    facts:
      why: >-
        Owner feedback 2026-11-16: the speaker button reads the whole answer, which he rarely wants, least of all on
        the phone; he wants to choose between a summarized and a full read. Today GET /v1/memos/:id/speech
        (server/src/http/media.ts:86-89) has one behaviour, speechVariant in server/src/memo/speech-text.ts:309-324:
        the whole reply when it fits SPEECH_MAX_CHARS (600), else the triage `spoken` line plus "details on screen".
        88 % of production replies (74 of 84) are under 600 characters, so nearly every read is the full reply, and a reply over
        600 can never be heard in full.
      what: >-
        server/src/memo/speech-text.ts, server/src/memo/media.ts, server/src/http/media.ts and schemas.ts, the speech
        cache under the data directory (its key must include the variant), contracts/ (make contracts, fixtures, make
        check-contracts), docs/http-api.md. No Apple code: the clients follow in row reply-playback-clients.
      change: >-
        An optional query parameter `variant` on the speech route: `summary` speaks the triage `spoken` line (when the
        memo has none, the first sentences of the reply, as the long-reply fallback does today) with no "details on
        screen" suffix; `full` speaks the whole cleaned reply whatever its length (state the upper bound you choose and
        why; chunk the synthesis if the audio door needs it); absent, the behaviour is exactly today's, so shipped apps
        and the auto-read of finished memos do not change. An unknown value is a 400 in the route's usual error shape.
      acceptance: >-
        Unit tests for the three cases on a short reply, a 2000-character reply and a memo without a spoken line; a
        route test shows two cache entries for two variants of one memo and a 400 for `variant=loud`; make
        check-contracts and make e2e pass; after the deploy both variants of one production memo answer 200 with audio
        of clearly different length (memo id and byte counts in the ship note).

  - key: transcript-continue-server
