        server/src/http/schemas.ts, contracts/, docs/http-api.md, docs/TDD.md. No Apple code: row
        transcript-continue-apple follows.
      change: >-
        The Spec decides the model; the default to argue for or against is to reuse threads rather than rewrite a memo:
        a transcribe memo may carry `threadId`, a thread of kind transcript gets a server-made id (a Hermes thread's id
        is the Hermes session id, server/src/adapters/hermes.ts:226-227), every continuation is its own memo with its
