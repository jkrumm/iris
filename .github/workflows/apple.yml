name: apple
on:
  push:
    branches: [master]
    paths: ["apple/**", "contracts/**", ".swift-format", "Makefile", ".github/workflows/apple.yml"]
  pull_request:
    branches: [master]
    paths: ["apple/**", "contracts/**", ".swift-format", "Makefile", ".github/workflows/apple.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its stale run. Other events get a group per commit, so master runs and dispatches never cancel or displace each other.
concurrency:
  group: apple-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apple:
    # Public repo: the hosted Xcode 27 image (TDD D14), same Xcode major as the mini.
    # Fall back to `macos-26` (Xcode 26.6, no iOS 27-only APIs) only if this label queues for more than 30 min.
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Check (theme drift, lint, swift test, build all schemes)
        run: make check-apple
      - name: Snapshots
        run: make snapshots
      - name: UI smoke
        run: make uitest
      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apple-diagnostics
          path: |
            apple/.dd.noindex/Logs/Test
            apple/Packages/IrisUI/.dd.noindex/Logs/Test
          if-no-files-found: warn
