name: check
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its stale run. Other events get a group per commit, so master runs (the deploy poller trusts their result) never cancel each other.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Public repo: hosted runners (free); self-hosted VPS runners are for private repos only.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      # The runner's Azure apt mirror stalls for the whole step (runs 42278842768, f8d50cf, 13549f1: even four 150 s attempts with
      # resume got nowhere), so ffmpeg and ffprobe come from a static build on GitHub Releases, which the runner reaches fast,
      # checked against the checksum file published beside it.
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null && exit 0
          BASE=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          ARCHIVE=ffmpeg-master-latest-linux64-gpl.tar.xz
          cd "$(mktemp -d)"
          curl -fsSL --retry 3 --max-time 300 -o "$ARCHIVE" "$BASE/$ARCHIVE"
          curl -fsSL --retry 3 --max-time 60 -o checksums.sha256 "$BASE/checksums.sha256"
          grep " $ARCHIVE\$" checksums.sha256 | sha256sum -c -
          tar -xJf "$ARCHIVE" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          sudo install -m 0755 ffmpeg ffprobe /usr/local/bin/
          ffmpeg -version | head -n 1
      # web/ e2e needs a Chromium (version pinned by web/bun.lock); the bare runner's fonts differ from the baselines, so
      # the screenshot comparison runs in the `web` job below (WEB_VISUAL=0 here).
      - name: Install Playwright Chromium
        run: |
          cd web && bun install --frozen-lockfile
          cd web && bunx playwright install --with-deps chromium
      - run: make check
        env:
          WEB_VISUAL: "0"
      - run: make e2e
  # The Playwright image is the render environment of the committed screenshot baselines (make web-snapshots). Its tag equals the
  # pinned @playwright/test version (PLAYWRIGHT_VERSION in the Makefile).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install make
        run: command -v make >/dev/null || (apt-get update && apt-get install -y --no-install-recommends make)
      - run: make check-web
        env:
          WEB_VISUAL: "1"
      - name: Upload Playwright report and diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-playwright
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
