name: check
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    # Public repo: hosted runners (free); self-hosted VPS runners are for private repos only.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: make check
      # The runner's Azure apt mirror can crawl (a 9 MB package stalled 2.5 min and the full install ran past the job's 15 min,
      # run 42218403920): no recommends (99 packages down to the codec libraries ffmpeg needs), short per-request timeout, retries.
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null && exit 0
          APT=(-o Acquire::http::Timeout=20 -o Acquire::Retries=5)
          sudo apt-get "${APT[@]}" update
          sudo apt-get "${APT[@]}" install -y --no-install-recommends ffmpeg
      - run: make e2e
