name: check
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    # Public repo: hosted runners (free); self-hosted VPS runners are for private repos only.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: make check
      # The runner's Azure apt mirror stalls for the whole step (runs 42278842768, f8d50cf, 13549f1: even four 150 s attempts with
      # resume got nowhere), so ffmpeg and ffprobe come from a static build on GitHub Releases, which the runner reaches fast,
      # checked against the checksum file published beside it.
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null && exit 0
          BASE=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          ARCHIVE=ffmpeg-master-latest-linux64-gpl.tar.xz
          cd "$(mktemp -d)"
          curl -fsSL --retry 3 --max-time 300 -o "$ARCHIVE" "$BASE/$ARCHIVE"
          curl -fsSL --retry 3 --max-time 60 -o checksums.sha256 "$BASE/checksums.sha256"
          grep " $ARCHIVE\$" checksums.sha256 | sha256sum -c -
          tar -xJf "$ARCHIVE" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          sudo install -m 0755 ffmpeg ffprobe /usr/local/bin/
          ffmpeg -version | head -n 1
      - run: make e2e
