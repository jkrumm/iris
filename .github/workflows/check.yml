name: check
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    # Public repo: hosted runners (free); self-hosted VPS runners are for private repos only.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: make check
      # The runner's Azure apt mirror can crawl (a 9 MB package stalled 2.5 min and the full install ran past the job's 15 min,
      # run 42218403920): no recommends (99 packages down to the codec libraries ffmpeg needs), short per-request timeout, retries.
      # `Acquire::http::Timeout` is per idle read, so a mirror that trickles bytes never trips it and the whole step stalled to its
      # limit twice more (runs 42278842768, and f8d50cf's): each attempt now has a hard 150 s ceiling and the next one resumes from the
      # .debs already downloaded.
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null && exit 0
          APT=(-o Acquire::http::Timeout=20 -o Acquire::Retries=5)
          for attempt in 1 2 3 4; do
            sudo timeout 150 apt-get "${APT[@]}" update || true
            sudo timeout 150 apt-get "${APT[@]}" install -y --no-install-recommends ffmpeg && exit 0
            echo "ffmpeg install attempt $attempt did not finish"
            sudo dpkg --configure -a || true
          done
          exit 1
      - run: make e2e
