# XcodeGen spec (TDD D10). `make generate` writes apple/Iris.xcodeproj (gitignored).
# Build-setting spellings verified against Xcode 27.1 (TDD §6): SWIFT_DEFAULT_ACTOR_ISOLATION takes
# `nonisolated | MainActor`; SWIFT_APPROACHABLE_CONCURRENCY is a YES/NO flag.
name: Iris
options:
  bundleIdPrefix: com.jkrumm
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Signing is injected per invocation (simulator builds pass CODE_SIGNING_ALLOWED=NO; device and TestFlight
    # builds pass DEVELOPMENT_TEAM). No team id is tracked here.
    CODE_SIGN_STYLE: Automatic
    # String catalogs (TDD §4 "Localization"): the compiler extracts every localizable literal of every target, and
    # `scripts/check-strings.ts` holds the catalogs to it.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  IrisCore:
    path: Packages/IrisCore
  IrisCapture:
    path: Packages/IrisCapture
  IrisUI:
    path: Packages/IrisUI
  IrisTelemetry:
    path: Packages/IrisTelemetry
  # The Mac's global hotkey and its recorder view (Carbon, no permission prompt, pinned exactly: the recorder broke on new macOS releases before; docs/research/2026-10-31-mac-hotkey.md).
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0

targets:
  Iris:
    type: application
    platform: iOS
    sources: [Iris]
    # The three iOS entitlements files are hand-kept (not generated): CODE_SIGN_ENTITLEMENTS is a variable, see settings.
    info:
      path: Iris/Info.plist
      properties:
        CFBundleDisplayName: Iris
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        # The git sha of the build, the `service.version` of every device record; the device build passes IRIS_BUILD_SHA.
        IrisBuildSHA: $(IRIS_BUILD_SHA)
        NSMicrophoneUsageDescription: Iris records your voice memos.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jkrumm.iris
        TARGETED_DEVICE_FAMILY: "1"
        IRIS_BUILD_SHA: dev
        # `scripts/device-build.sh` points these at copies without `aps-environment` (app) and the App Group (all three) while the team is a Personal Team.
        IRIS_APP_ENTITLEMENTS: Iris/Iris.entitlements
        CODE_SIGN_ENTITLEMENTS: $(IRIS_APP_ENTITLEMENTS)
    dependencies:
      - package: IrisCore
      - package: IrisCapture
      - package: IrisUI
      - package: IrisTelemetry
      - target: IrisWidgets
      - target: IrisNotifications
      # The App Intents metadata extractor warns on targets that do not link it; the app gets intents in R1.
      - sdk: AppIntents.framework

  IrisWidgets:
    type: app-extension
    platform: iOS
    # The Control names `StartMemoIntent`; the app performs it, so the intent file is compiled into both.
    sources: [IrisWidgets, Iris/Intents]
    info:
      path: IrisWidgets/Info.plist
      properties:
        CFBundleDisplayName: Iris Widgets
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jkrumm.iris.widgets
        IRIS_WIDGETS_ENTITLEMENTS: IrisWidgets/IrisWidgets.entitlements
        CODE_SIGN_ENTITLEMENTS: $(IRIS_WIDGETS_ENTITLEMENTS)
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    dependencies:
      - package: IrisCore
      - package: IrisUI

  IrisNotifications:
    type: app-extension
    platform: iOS
    sources: [IrisNotifications]
    info:
      path: IrisNotifications/Info.plist
      properties:
        CFBundleDisplayName: Iris Notifications
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: [MEMO_DONE, MEMO_NEEDS_ROUTE]
            UNNotificationExtensionInitialContentSizeRatio: 0.4
            UNNotificationExtensionDefaultContentHidden: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jkrumm.iris.notifications
        IRIS_NOTIFICATIONS_ENTITLEMENTS: IrisNotifications/IrisNotifications.entitlements
        CODE_SIGN_ENTITLEMENTS: $(IRIS_NOTIFICATIONS_ENTITLEMENTS)
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    dependencies:
      - package: IrisCore
      - package: IrisUI
      - sdk: AppIntents.framework

  IrisMac:
    type: application
    platform: macOS
    # The history model and sample data are UI-framework-free and shared with the iOS app.
    sources:
      - IrisMac
      - Iris/HistoryModel.swift
      - Iris/HiddenMemoStore.swift
      - Iris/HistoryFilters.swift
      - Iris/HistoryToast.swift
      - Iris/MemoPresentation.swift
      - Iris/ReplyMarkdown.swift
      - Iris/SampleData.swift
      - Iris/SampleThreads.swift
      # The connection (URL + Keychain token), the detail's step waterfall and the markdown reading are shared too.
      - Iris/ConnectionCredentials.swift
      - Iris/ConnectionModel.swift
      - Iris/ReconfigurableAPIClient.swift
      - Iris/HistorySections.swift
      - Iris/HistoryFilterBar.swift
      - Iris/StepBaselines.swift
      - Iris/StepText.swift
      - Iris/WaterfallBuilder.swift
      - Iris/ReplyMarkdown.swift
      - Iris/Pasteboard.swift
      # The capture side: the outbox stack, its API uploader and the created-memo log are the iPhone's, compiled in as they are.
      - Iris/CaptureStack.swift
      - Iris/APIOutboxUploader.swift
      - Iris/OutboxService.swift
      - Iris/QueuedItem.swift
    entitlements:
      path: IrisMac/IrisMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [group.com.jkrumm.iris]
    info:
      path: IrisMac/Info.plist
      properties:
        CFBundleDisplayName: Iris
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSMicrophoneUsageDescription: Iris records your voice memos.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jkrumm.iris.mac
        # A stable Apple Development identity keeps TCC grants across rebuilds (TDD §5); injected per build.
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: IrisCore
      - package: IrisCapture
      - package: IrisUI
      - package: IrisTelemetry
      - package: KeyboardShortcuts
      - sdk: AppIntents.framework

  # Hosted in the app: `@testable import Iris` reaches the history model and filters.
  IrisTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/UnitTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jkrumm.iris.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Iris

  # Hosted in the Mac app: `@testable import IrisMac` reaches the composition root, the notifier and the detail model.
  # Run by `make check-apple` (`xcodebuild -scheme IrisMac -destination 'platform=macOS' test`).
  IrisMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/MacTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jkrumm.iris.mac.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: IrisMac

  IrisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UITests]
    info:
      path: Tests/UITests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jkrumm.iris.uitests
        TEST_TARGET_NAME: Iris
        # XCUITest stays XCTest (swift.md); no MainActor-default friction for the test bundle.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    dependencies:
      - target: Iris
      - sdk: AppIntents.framework

schemes:
  Iris:
    build:
      targets:
        Iris: all
    run:
      config: Debug
      commandLineArguments:
        "-IrisFakeCapture": false
    test:
      config: Debug
      targets: [IrisTests, IrisUITests]
      # The tests read English text; the app is German now, so a German simulator (or a German developer machine) must not change them.
      language: en
      region: US
  IrisMac:
    build:
      targets:
        IrisMac: all
    run:
      config: Debug
      commandLineArguments:
        "-IrisFakeData": false
    test:
      config: Debug
      targets: [IrisMacTests]
      language: en
      region: US
      # The hosted app runs on the fake API and an in-memory credential store: no Keychain, no network, no permission prompt.
      commandLineArguments:
        "-IrisFakeData": true
