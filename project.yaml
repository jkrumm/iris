# How the factory ships this project (software-factory docs/design.md §9).
apiVersion: factory/v2
name: iris
deploy:
  mode: make # push to master deploys: the mini's poller (`make deploy` runs one tick) gates on CI, restarts for runtime paths and records the sha; `make verify` probes :7730, the audio door and the agw host
  targets:
    - { name: mini, host: mini, verify: make verify }
  hold: 10m # CI (~2 min) plus the poller's 120 s tick must land before `make version` is read
  migrations: [] # SQLite migrations are code (server/src/adapters/sqlite-migrations.ts), applied at boot
ship:
  - { paths: ["**"], via: push }
checks: { fast: make check-fast, full: make check, ci: true } # a lead runs fast; CI (check.yml on ubuntu, apple.yml on hosted xcode-27) runs the full gate on the PR head and `make merge-guard` demands its green runs
leads: 4 # two Apple rows beside two server and web rows; Apple builds still serialise on scripts/apple-slot
lanes:
  apple: 2 # two Apple rows at a time: local Apple runs queue on scripts/apple-slot (one at a time, at most one targeted run per change) and CI proves the rest, so the second row edits and waits on CI beside the first; the cost is more rebase conflicts on String catalogs and snapshots; server and web rows run beside both
signals:
  github:
    author: jkrumm # the owner's new issues come in
    since: 2026-11-07T06:30:00Z # cut-over: older backlog is never filed
